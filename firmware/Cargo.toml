[package]
name = "esp32-agent-firmware"
description = "esp32-agent firmware: an MCP server with a self-configuring hardware manifest, running on ESP-IDF"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

# Its own workspace: the firmware has a different target and toolchain from the
# host crates, so it must not inherit the root workspace.
[workspace]

[[bin]]
name = "esp32-agent"
path = "src/main.rs"

[dependencies]
esp-idf-svc = { version = "0.53", features = ["binstart", "critical-section"] }
esp-idf-hal = "0.47"
esp-idf-sys = { version = "0.38", features = ["binstart"] }
esp32-agent-core = { path = "../crates/agent-core" }
anyhow = "1"
log = "0.4"
serde_json = "1"


# LittleFS, from the ESP component registry: the filesystem the storage partition holds.
# `bindings_header` is what makes the C API visible from Rust (`esp_vfs_littlefs_register`,
# `esp_littlefs_info`); without it the component builds and stays unreachable.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1.23.1" }
bindings_header = "littlefs_bindings.h"
bindings_module = "littlefs"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

