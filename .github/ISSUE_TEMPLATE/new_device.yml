name: New device support
description: Request support for a new peripheral
labels: [device]
body:
  - type: input
    id: name
    attributes:
      label: Device part number
      placeholder: e.g. BH1750, RC522, SGP30
    validations:
      required: true
  - type: input
    id: datasheet
    attributes:
      label: Datasheet link
      description: At least the page holding the ID register or command table — the maintainer needs it to write `probe`.
    validations:
      required: true
  - type: textarea
    id: wiring
    attributes:
      label: Wiring
      description: Bus (I2C/SPI/1-Wire/GPIO), address, pins, pull-ups, supply voltage
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tools you want
      description: What you want to read or do, with units. For example `bh1750_read → {lux}`.
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: How you plan to add it
      options:
        - Manifest only (no timing or calibration needed)
        - I will write the driver and open a PR
        - I cannot write Rust, but I can supply test data
  - type: textarea
    id: sample
    attributes:
      label: Measured samples (optional, but valuable)
      description: Raw register values alongside the real physical quantity, so a unit test can assert against them.
