name: Bug report
description: Behaviour that contradicts the documentation, a crash, or a flashing failure
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search `docs/troubleshooting.md` first. Paste the raw output of `GET /api/logs`,
        not a description of it — "it does not work" cannot be acted on.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The firmware version from `/api/status`, or the git commit
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options: [ESP32-S3-DevKitC-1, ESP32 DevKit v1, ESP32-C3-DevKitM-1, ESP32-C6-DevKitC-1, custom/breadboard, simulator]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you expected and what actually happened. For tool calls, include the request and response JSON.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`/api/logs?n=200`, or the serial output from boot"
      render: text
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Relevant manifest or configuration
      description: The part of `manifest` or `config` involved (replace secrets with `__set__`)
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: "I ran `POST /api/devices/probe` and attached the `i2c_scan` result"
        - label: I ruled out wiring and power (swapped the cable or the module)
