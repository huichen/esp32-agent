[workspace]
resolver = "2"
members = ["crates/agent-core", "crates/agent-sim"]
# The firmware is a separate Cargo project: it needs the Xtensa/RISC-V ESP
# toolchain and a different target, so it must not be pulled into a host build.
exclude = ["firmware"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"
repository = "https://github.com/OLDK0D/esp32-agent"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
